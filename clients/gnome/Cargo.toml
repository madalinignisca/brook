[package]
name = "brook-gnome"
version = "0.0.0"
description = "Brook GNOME client (GTK4 + libadwaita)."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
brook-core = { path = "../../core", version = "0.0.0" }
gtk = { package = "gtk4", version = "0.9", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs"] }
pulldown-cmark = { version = "0.12", default-features = false }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Calls: the Linux media engine + the GStreamer types its events carry.
brook-media-gst = { path = "../gst-media", version = "0.0.0" }
gst = { package = "gstreamer", version = "0.23" }
gst-webrtc = { package = "gstreamer-webrtc", version = "0.23" }
# Two-factor enrolment: the otpauth QR code is rendered locally (it carries the secret).
qrcode = { version = "0.14", default-features = false }
# Staying signed in (#58): the session and store keys in the desktop keyring (Secret
# Service over D-Bus). Same ashpd/zbus majors as gst-media, so no duplicates.
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }

[dev-dependencies]
# Scans the rendered QR code back in tests.
rqrr = "0.11"
