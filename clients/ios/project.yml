# XcodeGen spec for the iOS client. Brook.xcodeproj is generated from this file and not
# committed: run ./build.sh (or `xcodegen` here) after changing it.
name: Brook
options:
  bundleIdPrefix: me.madalin
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  BrookCore:
    path: ../../bindings/apple/swift/BrookCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # iPhone only (an iPad runs it as an iPhone app).
    TARGETED_DEVICE_FAMILY: "1"
    # Apple Silicon only, like the Mac app: the core is never built for x86_64, so an x86_64
    # simulator build would fail to link.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES

targets:
  Brook:
    type: application
    platform: iOS
    sources: [Brook]
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      # Only the BrookCore product: BrookMedia and WebRTC are written for macOS and are not
      # built for iOS.
      - package: BrookCore
        products: [BrookCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.madalin.brook
        PRODUCT_NAME: Brook
        MARKETING_VERSION: "0.0"
        CURRENT_PROJECT_VERSION: "1"
    # Generated by XcodeGen on every run: edit here, never in the .plist. No entitlements file:
    # the app's default Keychain access group needs none.
    info:
      path: Brook/Info.plist
      properties:
        CFBundleDisplayName: Brook
        UILaunchScreen: {}
        # A Brook server on the LAN triggers the iPhone's Local Network prompt.
        NSLocalNetworkUsageDescription: Brook connects to your team's Brook server, which may be on your local network.
        NSHumanReadableCopyright: "© 2026 Madalin Ignisca and Brook contributors. Licensed under AGPL-3.0-or-later."

  BrookTests:
    type: bundle.unit-test
    platform: iOS
    # One file, not the folder: later steps put tests there whose subjects this target does not
    # compile yet. Step 5 widens this to the whole folder plus clients/ios/BrookTests.
    sources:
      - {path: ../apple-shared/BrookTests/SmokeTests.swift, name: AppleSharedTests}
    dependencies:
      - target: Brook
      - package: BrookCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.madalin.brook.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Brook.app/Brook
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Brook:
    build:
      targets:
        Brook: all
        BrookTests: [test]
    test:
      targets: [BrookTests]
