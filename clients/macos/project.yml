# XcodeGen spec for the macOS client. Brook.xcodeproj is generated from this file and not
# committed: run ./build.sh (or `xcodegen` here) after changing it.
name: Brook
options:
  bundleIdPrefix: dev.brook
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  BrookCore:
    path: ../../bindings/apple/swift/BrookCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  Brook:
    type: application
    platform: macOS
    sources: [Brook, Shared]
    configFiles:
      Release: Signing.xcconfig
    dependencies:
      - package: BrookCore
        products: [BrookCore, BrookMedia]
      # The image decoder runs in its own sandboxed process (previews spec §1).
      - target: BrookImageDecoder
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.brook.Brook
        # The thin-and-resign phase below edits the embedded WebRTC.framework in place, which
        # the user-script sandbox forbids (a declared output equal to its input is a cycle).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_NAME: Brook
        MARKETING_VERSION: "0.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        # Debug keeps Xcode's get-task-allow so a debugger can attach; Release ships only the
        # entitlements declared below (notarization rejects get-task-allow).
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          # Xcode skips the hardened runtime for ad-hoc ("-") signing; request it from codesign so
          # the Release build runs under the same restrictions as the notarized one. Not in Debug:
          # library validation there rejects Xcode's ad-hoc Brook.debug.dylib (no Team ID).
          OTHER_CODE_SIGN_FLAGS: "--options=runtime"
    # Generated by XcodeGen on every run — edit here, never in the .plist/.entitlements.
    info:
      path: Brook/Info.plist
      properties:
        CFBundleDisplayName: Brook
        LSApplicationCategoryType: public.app-category.social-networking
        # A Brook server on the LAN (e.g. the shared test server) triggers macOS Local Network privacy.
        NSLocalNetworkUsageDescription: Brook connects to your team's Brook server, which may be on your local network.
        NSCameraUsageDescription: Brook uses the camera for video in calls in Brook.
        NSMicrophoneUsageDescription: Brook uses the microphone for calls in Brook.
    entitlements:
      path: Brook/Brook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # UDP ICE candidates: with network.client alone the sandbox yields only TCP port-9
        # candidates and no media reaches the SFU (measured, C2 design §2). It permits inbound
        # traffic on sockets the process binds; Brook binds only libwebrtc's per-call ICE sockets.
        com.apple.security.network.server: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        # Save… (NSSavePanel) and attaching files (NSOpenPanel): a sandboxed app can't show
        # either panel without it. Only what the user picks in a panel, nothing wider.
        com.apple.security.files.user-selected.read-write: true
    postBuildScripts:
      # SwiftPM's WebRTC.framework is universal. Ship arm64 only: thin the EMBEDDED copy (never
      # the downloaded artifact) and re-sign it, before Xcode signs the app around it.
      - name: Thin and re-sign WebRTC.framework
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          fw="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/WebRTC.framework"
          bin="$fw/Versions/A/WebRTC"
          [ -f "$bin" ] || { echo "error: $bin not embedded"; exit 1; }
          if [ "$(lipo -archs "$bin")" != "arm64" ]; then
            lipo "$bin" -thin arm64 -output "$bin.thin"
            mv "$bin.thin" "$bin"
          fi
          flags=()
          [ "${CONFIGURATION}" = "Release" ] && flags+=(--options=runtime)
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" ${flags[@]+"${flags[@]}"} --timestamp=none "$fw"

  # Decodes image previews out of the app's process, sandboxed with no entitlements beyond
  # the sandbox key: no user data, no network (previews spec §1).
  BrookImageDecoder:
    type: xpc-service
    platform: macOS
    # Signed like the app (Release), so its team matches the app's.
    configFiles:
      Release: Signing.xcconfig
    sources: [BrookImageDecoder, Shared]
    dependencies:
      # One worker process per image, spawned by the service: it inherits the service's
      # entitlement-free sandbox.
      - target: BrookImageWorker
        embed: true
        copy:
          destination: executables
    postBuildScripts:
      # The worker runs with exactly its own entitlements (the sandbox, inherited), in every
      # build: Xcode adds testing exceptions to what it builds for tests, and a child with
      # extra keys beside `inherit` is killed at launch. Re-signed here, before the service
      # is signed around it.
      - name: Re-sign the worker with exactly its entitlements
        # Only when the worker changed: the service is then signed again around it (a run on
        # every build would break the service's seal whenever its own signing is skipped).
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/BrookImageWorker
        outputFiles:
          - $(DERIVED_FILE_DIR)/worker-resigned.stamp
        script: |
          set -euo pipefail
          worker="${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/BrookImageWorker"
          [ -f "$worker" ] || { echo "error: $worker not embedded"; exit 1; }
          # Release: the hardened runtime and a secure timestamp (notarization needs both on
          # every executable); Debug: no timestamp (offline, fast).
          flags=(--timestamp=none)
          [ "${CONFIGURATION}" = "Release" ] && flags=(--options=runtime --timestamp)
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "${flags[@]}" \
            --entitlements "${SRCROOT}/BrookImageWorker/BrookImageWorker.entitlements" "$worker"
          touch "${DERIVED_FILE_DIR}/worker-resigned.stamp"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.brook.BrookImageDecoder
        PRODUCT_NAME: BrookImageDecoder
        # Never Xcode's injected entitlements, not even in Debug: its test injection adds read
        # access to all of / and extra Mach lookups, which would make the sandbox probe test a
        # different sandbox from the shipped one (and no debugger attaches to the decoder).
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      configs:
        Release:
          OTHER_CODE_SIGN_FLAGS: "--options=runtime"
    info:
      path: BrookImageDecoder/Info.plist
      properties:
        CFBundleDisplayName: BrookImageDecoder
        XPCService:
          ServiceType: Application
    entitlements:
      path: BrookImageDecoder/BrookImageDecoder.entitlements
      properties:
        com.apple.security.app-sandbox: true

  BrookImageWorker:
    type: tool
    platform: macOS
    # Signed like the app (Release), so its team matches the app's.
    configFiles:
      Release: Signing.xcconfig
    sources: [BrookImageWorker, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.brook.BrookImageWorker
        PRODUCT_NAME: BrookImageWorker
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        SKIP_INSTALL: YES
      configs:
        Release:
          OTHER_CODE_SIGN_FLAGS: "--options=runtime"
    entitlements:
      path: BrookImageWorker/BrookImageWorker.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.inherit: true

  BrookTests:
    type: bundle.unit-test
    platform: macOS
    sources: [BrookTests]
    dependencies:
      - target: Brook
      - package: BrookCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.brook.BrookTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Brook.app/Contents/MacOS/Brook
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Brook:
    build:
      targets:
        Brook: all
        BrookTests: [test]
    test:
      targets: [BrookTests]
