name: rust

on:
  push:
    branches: [main]
    paths:
      ["core/**", "clients/**", "Cargo.toml", "Cargo.lock", "deny.toml", ".github/workflows/rust.yml"]
  pull_request:
    paths:
      ["core/**", "clients/**", "Cargo.toml", "Cargo.lock", "deny.toml", ".github/workflows/rust.yml"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4 / libadwaita dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # No --workspace: builds the default-members (core + gnome). The KDE client
      # needs Qt6/CXX-Qt/Kirigami not installed here; it gets its own CI job later.
      - name: Clippy (warnings = errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources
