[package]
name = "brook-core"
version = "0.0.0"
description = "Brook shared client core: networking, protocol, state."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# Single-origin test server (REST + /ws upgrade), as the client derives both from one base URL.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "net"] }
wiremock = "0.6"
