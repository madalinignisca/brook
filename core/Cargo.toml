[package]
name = "brook-core"
version = "0.0.0"
description = "Brook shared client core: networking, protocol, state."
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The in-process test origin (REST + /ws) for other crates' tests (e.g. the Apple bindings).
# Never enabled by a client build.
test-support = ["dep:axum", "tokio/net"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"], optional = true }
# dyn-compatible async trait for the platform MediaEngine.
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "macros", "fs", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing = { workspace = true }
url = { workspace = true }
# Keys for the local store: OS randomness, wiped from memory after use.
getrandom = "0.3"
zeroize = "1"
# The offline cache and outbox (#61, #63): SQLCipher, CommonCrypto on Apple, the system
# libcrypto on Linux (plan C0: go on both). ring is already in the tree via rustls: the
# stores' key check (HMAC-SHA256).
rusqlite = { version = "0.37", features = ["bundled-sqlcipher"] }
ring = "0.17"

[target.'cfg(unix)'.dependencies]
# The quarantine xattr on Open copies of cached files (keep-offline spec §4.4, macOS), and
# `O_NONBLOCK` for opening outgoing files (a named pipe mustn't block the open).
libc = "0.2"

[dev-dependencies]
# Log-secrecy test: capture everything, including tungstenite's `log` records.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
tracing-log = { version = "0.2", default-features = false, features = ["log-tracer", "std"] }
base64 = "0.22"
# Single-origin test server (REST + /ws upgrade), as the client derives both from one base URL.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "net"] }
wiremock = "0.6"
tempfile = "3"
