# cargo-deny configuration for the Rust workspace (core + clients).
# CI runs: cargo deny check advisories bans sources
# License enforcement is staged separately once the allow-list is curated
# against the full dependency tree (GTK/rustls pull crates with assorted SPDX).

[graph]
all-features = true

[advisories]
# Fail on known security advisories and yanked crates.
yanked = "deny"
ignore = []

[bans]
# Surface accidental heavy/duplicate dependencies without failing initially.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io and our own git, nothing unexpected.
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
# Present for when license-gating is enabled in CI; curate against the tree first.
allow = [
    "AGPL-3.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.8
