[workspace]
resolver = "2"
members = ["core", "clients/gst-media", "clients/gnome", "clients/kde", "bindings/apple"]
# Default builds/tests (and CI's non-`--workspace` commands) skip the KDE client:
# it needs Qt6 + CXX-Qt + Kirigami system tooling that plain `cargo build` and
# non-Plasma contributors lack. Build it explicitly with `-p brook-kde` on a
# machine with Qt6 installed. (A dedicated Qt-enabled CI job is a follow-up.)
# Default members need GTK4 + libadwaita and GStreamer (>= 1.20, with webrtcbin,
# libnice, x264/openh264, vp8, opus) dev libraries; see .github/workflows/rust.yml.
# bindings/apple builds on Linux too (no Apple-only deps), so CI checks it by default.
default-members = ["core", "clients/gst-media", "clients/gnome", "bindings/apple"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/madalinignisca/brook"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
url = "2"
