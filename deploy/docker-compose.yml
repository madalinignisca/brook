# Brook server stack. Default = the lean Phase 0 login stack (postgres + api + caddy).
# Object storage (Phase 2) and the media SFU (Phase 4) are behind compose profiles
# so they don't run until needed. See ./README.md and the Makefile.
name: brook

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-brook}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brook}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../services/api
    restart: unless-stopped
    environment:
      BROOK_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-brook}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-brook}
      BROOK_JWT_SIGNING_KEY: ${BROOK_JWT_SIGNING_KEY:?set BROOK_JWT_SIGNING_KEY in .env (>=32 chars)}
      # Schema is owned by Alembic: the api entrypoint runs `alembic upgrade head`
      # on start, so create_all must stay off (avoids drift between the two paths).
      BROOK_AUTO_CREATE_SCHEMA: "false"
      # Calls (Phase 4). api runs without Janus; call commands then answer
      # `sfu_unavailable` until `make media` brings the SFU up.
      BROOK_JANUS_URL: ws://janus:8188
      BROOK_JANUS_API_SECRET: ${JANUS_API_SECRET:-}
      # Dev/test only: serves the browser call harness at /dev/call. Keep false in
      # anything user-facing; it is a test tool, not a client.
      BROOK_DEV_HARNESS: ${BROOK_DEV_HARNESS:-false}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Plain HTTP (Phase 0). Switch the Caddyfile to TLS later.
      # Always IP:host:container. The short "8080:80" form makes Compose bind 0.0.0.0
      # AND [::], and Compose ignores the daemon's "ip" default, so on a host with a
      # public IPv6 address and no firewall the API would be on the internet.
      # Loopback by default; set BROOK_HTTP_BIND to one LAN address to serve a LAN.
      - "${BROOK_HTTP_BIND:-127.0.0.1}:${BROOK_HTTP_PORT:-8080}:80"
    volumes:
      - ../services/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # --- Phase 2: object storage. Enable with `make storage`. ---
  minio:
    image: minio/minio
    profiles: ["storage"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-brook}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    ports:
      # Admin console: loopback unless explicitly opened (see the caddy note above).
      - "${BROOK_MINIO_CONSOLE_BIND:-127.0.0.1}:${BROOK_MINIO_CONSOLE_PORT:-9001}:9001"

  # --- Phase 4: media SFU (Janus, built from services/sfu). Enable with `make media`. ---
  janus:
    build:
      context: ../services/sfu
    profiles: ["media"]
    restart: unless-stopped
    environment:
      # Shared with api only; every Janus API request must carry it.
      JANUS_API_SECRET: ${JANUS_API_SECRET:?set JANUS_API_SECRET in .env (make init generates it)}
      # The address clients send media to. Defaults to the media bind address.
      JANUS_PUBLIC_IP: ${BROOK_MEDIA_PUBLIC_IP:-${BROOK_MEDIA_BIND:-127.0.0.1}}
      JANUS_RTP_PORTS: ${BROOK_MEDIA_RTP_PORTS:-20000-20099}
    # 8188 = Janus WebSocket API: internal network only, NEVER published.
    expose:
      - "8188"
    ports:
      # Media (SRTP/DTLS over UDP), same rule as the gateway: always IP-qualified,
      # loopback by default, one named address for a LAN. Never the short form
      # (it binds 0.0.0.0 and [::]). Keep the range small: one port per stream.
      - "${BROOK_MEDIA_BIND:-127.0.0.1}:${BROOK_MEDIA_RTP_PORTS:-20000-20099}:${BROOK_MEDIA_RTP_PORTS:-20000-20099}/udp"

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
